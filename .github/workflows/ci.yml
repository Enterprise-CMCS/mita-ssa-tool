# Continuous Integration
# Runs on pull requests and pushes to main
# Validates code quality without deploying

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # 22.18 is the floor, not a preference: the XLSX workbook generator is a
        # TypeScript file run directly by Node, which needs Node's native type
        # stripping (unflagged from 22.18). On Node 20 it fails with an
        # unknown-file-extension error. Kept in step with `.nvmrc` and the `engines`
        # field in package.json.
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # `prebuild` generates the workbook, so this step also proves the generator runs as a
      # plain Node script under CI's runtime. That is not redundant with `npm test`: the suite
      # imports the generator's modules through Vite's transform and builds a workbook in
      # memory, so a failure of Node's native type stripping — the reason Node 22.18 is the
      # floor — would not show up there.
      - name: Build (verify it compiles, and generate the workbook)
        env:
          VITE_BASE_PATH: /test-build/
        run: npm run build

      # The suite never reads a file off disk, so nothing above notices if the workbook failed
      # to reach the built site. That failure mode is a 404 on the in-app download links.
      - name: Verify the shipped workbook
        run: npm run verify:workbook-artifact
