# Deploy to GitHub Pages
# Triggers on push to main branch
# Automatically uses the repository name for the base path

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Node floor is single-sourced from .nvmrc — see the note in ci.yml for why 22.18 is a
        # floor, not a preference (the workbook generator needs native TypeScript type stripping).
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      # `prebuild` generates the offline workbook into `public/`, which Vite then copies into
      # `dist/`. The file is gitignored, so it does not exist in a fresh checkout and this is
      # the only thing that puts it in the deployed site.
      - name: Build
        env:
          # Dynamically set base path from repo name
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Dynamically set GitHub repo URL
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          #
          # ---------------------------------------------------------------------------------
          # GO-LIVE SWITCH (Decision 13)
          #
          # To remove the predecisional pilot notices everywhere, in one change, delete the
          # "# " from the start of the next line. It is already at the correct indentation —
          # the same column as VITE_BASE_PATH above — so no re-alignment is needed. (Getting
          # that wrong yields a workflow file GitHub refuses to run, which is a bad thing to
          # discover on go-live day.)
          #
          # VITE_DRAFT_MODE: 'false'
          #
          # It is a single variable because every surface derives from it rather than carrying
          # its own copy of the wording. Setting it removes:
          #
          #   - the top and bottom banners on every page (`Layout.tsx`)
          #   - the "(Predecisional)" suffix on the document title and the static
          #     <title>/<meta description> that render as the link preview in Teams and Slack
          #   - the notice row in CSV maturity profiles, the JSON envelope's `draftNotice`,
          #     and the ZIP manifest's
          #   - the PDF cover band and the per-page PDF footer line
          #   - the workbook's A1 notice on every sheet, its print footer, its document
          #     properties, and the `00_README` notice section
          #
          # Two things to know before flipping it:
          #
          # 1. The default is notices ON. Only the literal string 'false' switches them off, so
          #    a typo, an empty value or a forgotten variable all fail toward showing the
          #    notice, which is the safe direction.
          # 2. Only the app reads `import.meta.env`; the workbook generator reads
          #    `process.env`. Both are set by this one `env:` block because `prebuild` runs in
          #    the same step, so the app and the workbook cannot disagree.
          #
          # `workbook.test.ts` has a suite that runs the whole generator with the flag flipped,
          # so the off path is covered by tests. Generate one and open it before go-live
          # regardless — no human has yet looked at a notice-free workbook.
          # ---------------------------------------------------------------------------------
        run: npm run build

      # Fail the deploy rather than publish a site whose workbook download links 404.
      - name: Verify the shipped workbook
        run: npm run verify:workbook-artifact

      # Assert the built index.html carries the Vite build markers BEFORE publishing, so a build
      # that somehow emitted a bundle-less page (or left an unreplaced %BASE_URL% placeholder) is
      # caught here rather than after it is live. This is the one marker check that can actually
      # prevent a bad publish; the post-deploy and standing-monitor checks only report after the
      # fact. Pre-deploy is a local file, so it is a grep, not a fetch.
      - name: Verify the built index.html is the app
        run: |
          index="dist/index.html"
          if ! grep -q '/assets/index-' "$index"; then
            echo "::error::$index has no /assets/index- bundle — the build did not produce an app page."
            exit 1
          fi
          if grep -q '%BASE_URL%' "$index"; then
            echo "::error::$index still contains the %BASE_URL% placeholder — Vite base substitution did not run."
            exit 1
          fi
          echo "Built index.html carries the Vite build markers."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job — only deploys. Verification is a separate job (below) so that a verification
  # failure is reported as "Verify deployment — failure", not as a broken deploy on a run whose
  # publish actually succeeded.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Verification job
  #
  # Repository Settings -> Pages -> Source should be "GitHub Actions" (build_type "workflow"). If
  # it is "Deploy from a branch" (build_type "legacy") instead, GitHub's built-in Jekyll pipeline
  # runs *in addition to* this workflow — both publish to the same site and the last successful
  # publish wins — so on an event that triggers Jekyll but no Vite deploy, a raw source render can
  # become what is live. A committed file cannot change that setting, so these checks detect it: the
  # config check reads the Pages build_type directly (the primary signal), and the content check
  # confirms what is live right now. verify-deployment.yml keeps watching after this run ends.
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Primary gate: the Pages Source setting itself — decisive regardless of what is live. `gh`
      # is preinstalled on the runner; GH_TOKEN carries this job's pages:read.
      - name: Verify Pages Source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:pages-config

      # Secondary: fetch what was just published (cache-busted with the commit SHA to bypass the
      # edge cache) and confirm a Vite-built page is served. Catches a publish that produced the
      # wrong bytes, which the config field cannot see. The URL is passed via env, never
      # interpolated into the shell command.
      - name: Verify the deployed site is the app
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}?v=${{ github.sha }}
        run: npm run verify:deployed-site
